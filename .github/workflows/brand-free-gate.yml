name: brand-free-gate

# Issue #404 (rescoped by #591): the engine's public surface must carry no
# FUNCTIONAL reference to the private org, and no corporate-domain leak.
#
# The toaster is a brand-free empty shell developed in public (epic #408).
# tests/lint-brand-free.py scans every tracked file EXCEPT the paths in
# public-cut-exclude.txt -- i.e. exactly what a public cut would publish --
# and hard-fails on the corporate domain outside a reviewed allowlist, on
# 'exos-legal' in a FUNCTIONAL position (image path, repo URL, CODEOWNERS-
# style team, workflow org ref), and on any tests/ .docx that does not
# declare itself synthetic. The tenant brand string itself ("Exos") is
# publishable per owner ruling and is no longer policed here. It self-tests
# its own scanner first, so a matcher that silently matches nothing cannot
# pass.
#
# scripts/check.sh already runs this file (its loop picks up tests/lint-*.py).
# This workflow exists so the gate also blocks pushes and pull requests
# independently of the full suite.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  brand-free:
    # Same indirection as the other 29 gate jobs: `vars.CI_RUNS_ON` points at
    # the self-hosted fleet, falling back to a GitHub-hosted runner if unset.
    # This gate was the one left hardcoded, so it kept targeting a runner that
    # is currently unavailable and failed before its first step could run --
    # a red gate on every push that said nothing about the brand lint.
    # (ci-pipeline.yml's build-sign-push/promote jobs stay hardcoded on
    # purpose; they need Docker + AWS OIDC the home-lab runner lacks.)
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The lint reads `git ls-files`; a shallow checkout is fine, but the
          # working tree must be complete.
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Brand-free lint
        run: python3 tests/lint-brand-free.py
