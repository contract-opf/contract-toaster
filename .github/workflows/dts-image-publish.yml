# Publish the two Docker Compose deploy images to GHCR.
#
# Manual-dispatch ONLY (workflow_dispatch, no push/PR trigger) — matches this
# repo's "no auto-deploy; a human runs it deliberately" convention. Builds the
# backend and frontend images from the deploy/dts/ Dockerfiles (repo-root
# context) and pushes each as :latest and :<short-sha> to
# ghcr.io/<repository-owner>/contract-toaster-dts-{backend,frontend}.
#
# Auth uses the built-in GITHUB_TOKEN (packages: write) — no extra secret. The
# packages are created PRIVATE by default; flipping them to Public is a separate
# deliberate step done outside this workflow.
#
# Runs on the self-hosted runner (vars.CI_RUNS_ON) while GitHub-hosted Actions
# is unavailable; falls back to ubuntu-latest if the variable is unset. Uses the
# plain docker CLI (no buildx/QEMU) to keep runner requirements minimal.

name: Publish Docker Compose images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            dockerfile: deploy/dts/backend.Dockerfile
          - component: frontend
            dockerfile: deploy/dts/frontend.Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image ref and short SHA
        id: meta
        run: |
          # Owner is derived from the repository, never hard-coded: the same workflow
          # publishes under whichever org hosts it (issue #406).
          owner="$(echo "${{ github.repository_owner }}" | tr "[:upper:]" "[:lower:]")"
          echo "image=ghcr.io/${owner}/contract-toaster-dts-${{ matrix.component }}" >> "$GITHUB_OUTPUT"
          short_sha="${GITHUB_SHA::7}"
          echo "sha=${short_sha}" >> "$GITHUB_OUTPUT"
          # VERSION follows the AWS path's convention (ci-pipeline.yml:320-321):
          # "<short-sha>-<UTC build timestamp>", unique per build so two builds
          # of the same commit are still distinguishable in the footer.
          echo "version=${short_sha}-$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          # Version metadata is baked into the BACKEND image only: it is what
          # serves GET /version (issue #424). deploy/dts/frontend.Dockerfile
          # declares no such ARGs, so passing them there would only produce an
          # unconsumed-build-arg warning.
          # Seeded with -f so the array is never empty (expanding an empty array
          # is an error on bash < 4.4 under `set -u`).
          build_flags=(-f "${{ matrix.dockerfile }}")
          if [ "${{ matrix.component }}" = "backend" ]; then
            build_flags+=(--build-arg "VERSION=${{ steps.meta.outputs.version }}")
            build_flags+=(--build-arg "COMMIT_SHA=${{ steps.meta.outputs.sha }}")
          fi
          docker build \
            "${build_flags[@]}" \
            -t "${{ steps.meta.outputs.image }}:latest" \
            -t "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}" \
            .

      - name: Push image (:latest and :<short-sha>)
        run: |
          docker push "${{ steps.meta.outputs.image }}:latest"
          docker push "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}"
          # IMAGE_DIGEST is only knowable AFTER the push — it is the digest of
          # the pushed manifest, so the build cannot bake it in (doing so would
          # change the digest). Echo it here, mirroring ci-pipeline.yml's
          # capture on the AWS path, so an operator can paste it into the deploy
          # host's IMAGE_DIGEST variable. Left unset it stays "unknown", which
          # GET /version degrades to gracefully (backend/src/main.py).
          digest="$(docker inspect \
            --format='{{index .RepoDigests 0}}' \
            "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}" \
            | cut -d@ -f2)"
          echo "Pushed image digest: ${digest}"
