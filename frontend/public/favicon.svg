<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Contract Toaster">
  <!--
    Favicon (issue #427). A flattened, 16px-legible reduction of the toaster
    silhouette; deliberately NOT the photoreal ToasterHero SVG, which carries
    far too much detail to survive a 16x16 raster.

    Colors are the literal CTDS day-theme token values (src/styles/tokens.css):
    #af4b29 is ct-accent (background), #fff8f2 is ct-accent-contrast (body),
    #d9a463 is ct-toast (the slice), #a5401f is ct-accent-strong (slot/lever).
    They are inlined rather than referenced through a CSS custom property
    because a favicon loads as a standalone document and inherits none of the
    app's CSS. Full-bleed square (no rounded corners) so the .ico raster of
    this same artwork needs no transparency.

    This file is the SOURCE OF TRUTH for the icon. favicon.ico beside it is a
    raster of this exact artwork (16/32/64px PNG entries), produced on macOS
    with:
      qlmanage -t -s 256 -o out favicon.svg
      sips -z N N out/favicon.svg.png  (N = 16, 32, 64)
    then wrapped in an ICONDIR header. Re-raster it if the artwork changes.

    NOTE for editors: an XML comment may not contain a double hyphen, so this
    block spells the design tokens without their leading dashes.
  -->
  <rect width="64" height="64" fill="#af4b29"/>
  <!-- toast slice popping out of the slot -->
  <rect x="24" y="8" width="16" height="20" rx="3" fill="#d9a463"/>
  <!-- toaster body -->
  <rect x="8" y="24" width="48" height="32" rx="6" fill="#fff8f2"/>
  <!-- slot -->
  <rect x="17" y="30" width="30" height="5" rx="2.5" fill="#a5401f"/>
  <!-- lever -->
  <rect x="47" y="40" width="6" height="10" rx="3" fill="#a5401f"/>
</svg>
