# Cache-Control policy (issue #467): this file is included inside the image's
# `http {}` block (see deploy/dts/frontend.Dockerfile — copied to
# /etc/nginx/conf.d/default.conf, and the base nginx.conf does
# `include /etc/nginx/conf.d/*.conf;` from within `http {}`), so `map` is
# valid here even though there is no explicit `http {}` wrapper in this file.
#
# Vite fingerprints every built asset (assets/index-<hash>.js), so those can
# be cached forever; index.html references the current hashes and must NEVER
# be heuristically cached by the browser, or a redeploy silently keeps
# serving the old app from cache (the incident this fixes — issue #467).
# Deliberately keyed on $uri, not on a `location` block: an `add_header` in a
# `location` block REPLACES the server-level security headers added for
# issue #387 rather than merging with them (see the comment above), so the
# safest way to vary Cache-Control by path is a single server-level
# `add_header` driven by this map, never a per-location `add_header`.
#
# The api/version/health/openapi.json prefixes map to "" on purpose: nginx
# omits `add_header` entirely when its value is an empty string, so those
# reverse-proxied backend responses pass through with whatever Cache-Control
# the backend itself set (e.g. `no-store` on download/presign responses per
# ARCHITECTURE.md and tests/test_download_auth_attack.py) instead of also
# picking up a second, toaster-added Cache-Control header from this map.
map $uri $cache_control_toaster {
    default                                       "no-cache";
    ~*^/assets/                                    "public, max-age=31536000, immutable";
    ~*^/(api/|version|health|openapi\.json)        "";
}

# Serve the SPA and reverse-proxy the API to the backend so the browser talks
# to a single origin (no CORS config needed on the backend).
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Contract uploads must survive the proxy. nginx defaults
    # client_max_body_size to 1m, which silently breaks this product: the
    # backend deliberately accepts up to 25 MiB
    # (upload_validation.MAX_UPLOAD_SIZE_BYTES) and, past that, returns a
    # designed 413 with a `file_too_large` reason code that the SPA renders as
    # friendly copy. At the default, nginx would instead reject any agreement
    # over 1 MB itself -- which real .docx contracts with images/logos clear
    # easily -- with a bare HTML error page the SPA can't parse, never reaching
    # the backend's validation at all.
    #
    # Set deliberately ABOVE the app cap: the backend stays the single
    # authority on the upload limit (so the user gets the structured error),
    # while nginx remains a coarse backstop against absurd bodies. The headroom
    # covers multipart/form-data overhead on a file right at the 25 MiB line.
    client_max_body_size 32m;

    # Security headers (issue #387): the Amplify/CloudFront target ships a
    # strict CSP (infra/lib/nested/frontend-stack.ts:213); this closes the
    # parity gap for the self-hosted DTS target. Same posture as Amplify
    # minus the Cognito/API origins -- DTS is single-origin (nginx
    # reverse-proxies /api/ below; auth is password-mode, no Cognito).
    # `style-src 'unsafe-inline'` is required by the toaster's inline
    # <style> block and Amplify UI inline styles (docs/frontend-design-system.md
    # §3.1). No `media-src` -- audio intentionally falls to `default-src 'self'`.
    #
    # These MUST stay at server level: in nginx, `add_header` in a location
    # block REPLACES (does not merge with) inherited server-level headers, so
    # no location block below may declare its own `add_header` or it will
    # silently drop these (tests/test_dts_nginx_csp.py checks this).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; font-src 'self' data:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Cache-Control (issue #467): no-cache by default (index.html and the SPA
    # fallback must always revalidate -- ETag makes that a cheap 304) except
    # for the content-hashed /assets/ bundle, which is safe to cache forever.
    # Driven by the $cache_control_toaster map above so it stays at server
    # level -- see that map's comment for why this must never move into a
    # `location` block.
    add_header Cache-Control $cache_control_toaster always;

    # API + auth + health/version -> backend. Keep this list in sync with the
    # backend's route prefixes (src/main.py, src/review_routes.py).
    #
    # X-Forwarded-For on the /api/ hop (issue #469's login-throttle IP key,
    # backend/src/demo_auth.py::client_ip_from_request): OVERWRITTEN with
    # $remote_addr (this nginx's own view of its direct peer), NEVER passed
    # through from an inbound client-supplied header -- a caller cannot spoof
    # their own throttle bucket by sending their own X-Forwarded-For to this
    # hop. The backend only honors this header at all when
    # TRUST_PROXY_HEADERS=1 (deploy/dts/docker-compose.yml sets it; see that
    # file's comment and demo_auth.py::_trust_proxy_headers), paired with
    # binding the backend's host port to 127.0.0.1 there so it is not
    # additionally reachable bypassing this proxy.
    #
    # $remote_addr is trustworthy as "the real client" ONLY when nothing
    # else sits in front of this nginx -- true for docker-compose.yml, where
    # this frontend service is itself the directly-published edge. It is
    # NOT true for docker-compose.coolify.yml, where this nginx sits behind
    # Coolify's Traefik: there, $remote_addr is Traefik's own address, not
    # the browser's, so every real client collapses into one shared
    # per-username throttle bucket. That topology deliberately leaves
    # TRUST_PROXY_HEADERS unset (backend falls back to keying on its direct
    # peer, i.e. this nginx -- the same single-shared-bucket outcome, not a
    # worse one) rather than trusting a header this nginx cannot itself
    # verify against Traefik. Wiring Traefik's real client IP through
    # correctly is a follow-on, not done here.
    location /api/    { proxy_pass http://backend:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
    location /version { proxy_pass http://backend:8080; proxy_set_header Host $host; }
    location /health  { proxy_pass http://backend:8080; proxy_set_header Host $host; }
    location /openapi.json { proxy_pass http://backend:8080; proxy_set_header Host $host; }

    # SPA fallback: any other path serves index.html (client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
