# Docker Compose deployment — the parallel, non-AWS target.
#
# Storage:  S3 -> MinIO, DynamoDB -> DynamoDB-Local (both durable via volumes).
# Model:    OpenRouter (direct API key). MODEL_PROVIDER=openrouter below selects
#           the REAL review chain, so a working key is required: there is no
#           mock fallback, and without a key every review lands in ERROR. Supply
#           it EITHER in the admin UI's "Model & API key" tab (stored in
#           MODEL_SETTINGS_TABLE, rotatable without a restart) OR as
#           OPENROUTER_API_KEY in deploy/dts/.env. The admin-set key wins.
# Auth:     username/password (demo mode). Seeded admin/admin, user/user.
# Pipeline: in-process (PIPELINE_RUNNER=inprocess), no Step Functions.
#
# Bring up:  docker compose -f deploy/dts/docker-compose.yml --env-file deploy/dts/.env up --build
# See deploy/dts/README.md#downloads-presigned-urls--no-host-setup-required
# (downloads are presigned against S3_PUBLIC_ENDPOINT_URL below; zero
# /etc/hosts edits required — no host-file setup for downloads).

x-aws-emulator-env: &aws-emulator-env
  AWS_REGION: us-east-1
  # MinIO/DDB-Local accept any non-empty credentials; these must match MinIO's
  # root user/password below. Present in env, so config.boto3_client_kwargs uses
  # them (not its dummy fallback).
  AWS_ACCESS_KEY_ID: local
  AWS_SECRET_ACCESS_KEY: localsecret
  S3_ENDPOINT_URL: http://minio:9000
  DYNAMODB_ENDPOINT_URL: http://dynamodb-local:8000

# Shared by `bootstrap` and `backend` — both run the same image, so a single
# anchor keeps them on one build (differing build args would build it twice).
x-backend-build: &backend-build
  context: ../..
  dockerfile: deploy/dts/backend.Dockerfile
  args:
    # Baked into the image as ENV by deploy/dts/backend.Dockerfile and read by
    # GET /version (issue #424). The defaults match the /version fallbacks, so
    # a plain `docker compose build` behaves exactly as before; pass real
    # values with e.g.
    #   VERSION=$(git describe --tags --always) \
    #   COMMIT_SHA=$(git rev-parse --short HEAD) \
    #   docker compose -f deploy/dts/docker-compose.yml build
    VERSION: ${VERSION:-dev}
    COMMIT_SHA: ${COMMIT_SHA:-unknown}

x-resource-names: &resource-names
  USERS_TABLE: contract-toaster-users-dts
  REVIEWS_TABLE: contract-toaster-reviews-dts
  REVIEW_SUBMISSIONS_TABLE: contract-toaster-review-submissions-dts
  DAILY_SPEND_TABLE: contract-toaster-daily-spend-dts
  AUDIT_TABLE: contract-toaster-audit-dts
  AUTH_SETTINGS_TABLE: contract-toaster-auth-settings-dts
  PLAYBOOKS_TABLE: contract-toaster-playbooks-dts
  PLAYBOOK_VERSIONS_TABLE: contract-toaster-playbook-versions-dts
  RETENTION_SETTINGS_TABLE: contract-toaster-retention-settings-dts
  MODEL_SETTINGS_TABLE: contract-toaster-model-settings-dts
  SYNC_STATUS_TABLE: contract-toaster-sync-status-dts
  UPLOADS_BUCKET: contract-toaster-uploads-dts
  OUTPUTS_BUCKET: contract-toaster-outputs-dts

services:
  dynamodb-local:
    image: amazon/dynamodb-local:2.5.2
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/data"]
    working_dir: /home/dynamodblocal
    # Run as root so DynamoDB-Local can create its SQLite file in the volume.
    # The image runs as `dynamodblocal` (uid 1000), but `/data` does not exist
    # in the image, so Docker creates a FRESH `ddb-data` volume owned by
    # root:root and uid 1000 cannot write to it. The symptom is nasty because
    # the container looks fine: it keeps serving HTTP (a bare GET still answers
    # 400) while every real request hangs, and the logs scroll
    # `SQLiteException: [14] unable to open database file` +
    # `SQLiteQueue ... stopped abnormally, reincarnating in 3000ms` forever, so
    # `bootstrap` just times out with an unhelpful "not ready within 60s".
    # This only bites on a volume Docker created fresh (i.e. a new machine, or
    # after `docker compose down -v`), which is why it can lie dormant.
    # DynamoDB-Local is a throwaway local emulator, never production, so root
    # here is a fair trade for a one-line fix that works on both fresh and
    # already-chowned volumes. Do NOT drop this without also chowning /data.
    user: root
    restart: unless-stopped
    volumes:
      - ddb-data:/data
    ports:
      - "8000:8000"

  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: local
      MINIO_ROOT_PASSWORD: localsecret
    restart: unless-stopped
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"   # S3 API (browser must reach this for presigned downloads)
      - "9001:9001"   # console

  bootstrap:
    build: *backend-build
    command: ["python3", "/app/deploy/dts/bootstrap.py"]
    working_dir: /app
    environment:
      <<: [*aws-emulator-env, *resource-names]
    depends_on:
      dynamodb-local:
        condition: service_started
      minio:
        condition: service_started
    restart: "no"

  backend:
    build: *backend-build
    environment:
      <<: [*aws-emulator-env, *resource-names]
      # Version metadata (issue #424) is BAKED INTO THE IMAGE by the build args
      # above. These three are listed in the pass-through form (a key with no
      # value) on purpose: compose resolves them from the host environment and,
      # when unset there, does not pass them at all, leaving the image's ENV
      # intact. Writing `VERSION: ${VERSION:-dev}` here instead would ALWAYS
      # override the baked-in value — a compose `environment:` entry beats the
      # image ENV — and re-break the footer this ticket fixes.
      VERSION:
      COMMIT_SHA:
      IMAGE_DIGEST:
      DEPLOY_TARGET: dts
      MODEL_PROVIDER: openrouter
      AUTH_MODE: password
      PIPELINE_RUNNER: inprocess
      STATE_MACHINE_ARN: "inprocess:contract-toaster-dts"
      # Presigned download URLs are host-bound (issue #273): the backend's
      # other S3 calls use S3_ENDPOINT_URL (the compose-internal `minio`
      # DNS name, unresolvable from a browser on the host), but downloads
      # must be signed for a host-reachable endpoint instead. Port 9000 is
      # published to the host above, so localhost:9000 reaches the same
      # MinIO. Zero /etc/hosts edits required.
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      DEMO_TOKEN_SECRET: ${DEMO_TOKEN_SECRET:?set DEMO_TOKEN_SECRET in deploy/dts/.env}
      # Fallback only: the admin-set key (MODEL_SETTINGS_TABLE, "Model & API
      # key" tab) takes precedence when present. Leave blank to manage the key
      # entirely from the admin UI.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ../..
      dockerfile: deploy/dts/frontend.Dockerfile
    depends_on:
      - backend
    restart: unless-stopped
    ports:
      - "8081:8080"

volumes:
  ddb-data:
  minio-data:
