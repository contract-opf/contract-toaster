# Docker Compose deployment — generic, image-based variant for Coolify
# (or any host that pulls prebuilt images instead of building from source).
#
# Differences from docker-compose.yml (the build-from-source local variant):
#   - backend/bootstrap/frontend pull published GHCR images instead of `build:`.
#   - No host `ports:` publishing on backend/frontend: the reverse proxy routes
#     a domain to each service's internal container port (set in the Coolify UI).
#   - Every deployment-specific value is a bare ${VAR}, filled in by the host's
#     own UI. No domains, secrets, or host references live in this file.
#
# Service topology:
#   - frontend (nginx, container port 8080) serves the SPA AND reverse-proxies
#     /api, /version, /health, /openapi.json to backend:8080 over the internal
#     network. Assign the app domain to THIS service. backend needs no domain.
#   - minio (container port 9000) must be reachable directly from the browser:
#     downloads are presigned URLs the browser follows straight to MinIO. Assign
#     a SECOND domain to minio, and set S3_PUBLIC_ENDPOINT_URL to that domain so
#     the backend signs URLs the browser can actually reach.
#
# Required environment variables (set in the deploy host's UI, never in git):
#   GHCR_OWNER              - the GitHub org/user whose GHCR packages this
#                             deployment pulls, e.g. the owner of the repo that
#                             ran .github/workflows/dts-image-publish.yml. That
#                             workflow publishes under its OWN repository owner,
#                             so this matches whichever fork/org built the
#                             images. Kept out of the file for the same reason
#                             every other deployment-specific value is (no host
#                             or org references live in git). If the packages
#                             are private, the host also needs a GHCR pull
#                             credential.
#   DEMO_TOKEN_SECRET       - session-signing secret for demo password auth.
#   OPENROUTER_API_KEY      - OPTIONAL fallback. MODEL_PROVIDER=openrouter runs
#                             the REAL review chain and there is NO mock
#                             fallback: with no key reachable, every review
#                             lands in ERROR (stage=build_model_client), and a
#                             wrong key ERRORs at stage=run_review. Prefer
#                             setting the key in the admin UI's "Model & API
#                             key" tab, which overrides this var and can be
#                             rotated without a redeploy.
#   S3_PUBLIC_ENDPOINT_URL  - public https URL of the minio service's domain,
#                             e.g. https://<your-minio-subdomain>.
#   IMAGE_DIGEST            - OPTIONAL. The pushed image's sha256 digest, shown
#                             by GET /version. It cannot be baked into the image
#                             (it is the digest OF that image), so the publish
#                             workflow prints it after `docker push` and an
#                             operator may paste it here. Unset it reports
#                             "unknown", which degrades gracefully.
#   VERSION / COMMIT_SHA    - OPTIONAL overrides only. Both are baked into the
#                             published image at build time; leave them unset
#                             unless you deliberately want to override.

x-aws-emulator-env: &aws-emulator-env
  AWS_REGION: us-east-1
  # MinIO/DDB-Local accept any non-empty credentials; these must match MinIO's
  # root user/password below.
  AWS_ACCESS_KEY_ID: local
  AWS_SECRET_ACCESS_KEY: localsecret
  S3_ENDPOINT_URL: http://minio:9000
  DYNAMODB_ENDPOINT_URL: http://dynamodb-local:8000

x-resource-names: &resource-names
  USERS_TABLE: contract-toaster-users-dts
  REVIEWS_TABLE: contract-toaster-reviews-dts
  REVIEW_SUBMISSIONS_TABLE: contract-toaster-review-submissions-dts
  DAILY_SPEND_TABLE: contract-toaster-daily-spend-dts
  AUDIT_TABLE: contract-toaster-audit-dts
  AUTH_SETTINGS_TABLE: contract-toaster-auth-settings-dts
  PLAYBOOKS_TABLE: contract-toaster-playbooks-dts
  PLAYBOOK_VERSIONS_TABLE: contract-toaster-playbook-versions-dts
  PLAYBOOK_INSTRUCTIONS_TABLE: contract-toaster-playbook-instructions-dts
  RETENTION_SETTINGS_TABLE: contract-toaster-retention-settings-dts
  MODEL_SETTINGS_TABLE: contract-toaster-model-settings-dts
  SYNC_STATUS_TABLE: contract-toaster-sync-status-dts
  MODEL_INVOCATIONS_TABLE: contract-toaster-model-invocations-dts
  UPLOADS_BUCKET: contract-toaster-uploads-dts
  OUTPUTS_BUCKET: contract-toaster-outputs-dts

services:
  dynamodb-local:
    image: amazon/dynamodb-local:2.5.2
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/data"]
    working_dir: /home/dynamodblocal
    # Run as root so DynamoDB-Local can create its SQLite file in the volume --
    # see the long explanation in docker-compose.yml. Short version: the image
    # runs as uid 1000, `/data` isn't in the image, so Docker creates a fresh
    # `ddb-data` volume as root:root that uid 1000 can't write. The container
    # then serves HTTP while every real request hangs, and bootstrap times out
    # with a misleading "not ready within 60s". Bites on any fresh volume.
    user: root
    restart: unless-stopped
    volumes:
      - ddb-data:/data

  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: local
      MINIO_ROOT_PASSWORD: localsecret
    restart: unless-stopped
    volumes:
      - minio-data:/data

  bootstrap:
    image: ghcr.io/${GHCR_OWNER}/contract-toaster-dts-backend:latest
    command: ["python3", "/app/deploy/dts/bootstrap.py"]
    working_dir: /app
    environment:
      <<: [*aws-emulator-env, *resource-names]
    depends_on:
      dynamodb-local:
        condition: service_started
      minio:
        condition: service_started
    restart: "no"

  backend:
    image: ghcr.io/${GHCR_OWNER}/contract-toaster-dts-backend:latest
    environment:
      <<: [*aws-emulator-env, *resource-names]
      DEPLOY_TARGET: dts
      # Issue #509: the retention purge cadence. The sweep itself has been
      # correct since #454, but nothing on this target ever invoked it -- an
      # operator saw a healthy PREVIEW while uploaded contracts and outputs
      # accumulated in MinIO forever. backend/src/purge_scheduler.py runs it
      # on this interval; the AWS target is unaffected (its Lambda owns the
      # cadence there). Set PURGE_SWEEP_ENABLED=0 to turn it off without
      # editing code.
      PURGE_SWEEP_INTERVAL_SECONDS: "${PURGE_SWEEP_INTERVAL_SECONDS:-3600}"
      MODEL_PROVIDER: openrouter
      AUTH_MODE: password
      # Issue #469: TRUST_PROXY_HEADERS is deliberately left UNSET here
      # (unlike docker-compose.yml). This nginx (frontend service) sits
      # behind Coolify's own Traefik reverse proxy in this topology, so its
      # $remote_addr -- the value it forwards as X-Forwarded-For -- is
      # Traefik's address, not the real client's (see deploy/dts/nginx.conf's
      # /api/ comment). Backend/src/demo_auth.py::client_ip_from_request
      # falls back to keying the login throttle on its direct peer instead,
      # which is the same "one shared bucket per username" outcome as
      # trusting that header would be here -- not worse, and not a header
      # this nginx can itself verify against Traefik. Wiring Traefik's real
      # client IP through is a follow-on.
      PIPELINE_RUNNER: inprocess
      STATE_MACHINE_ARN: "inprocess:contract-toaster-dts"
      # Version metadata (issue #424). VERSION and COMMIT_SHA are BAKED INTO
      # THE IMAGE at build time by .github/workflows/dts-image-publish.yml;
      # IMAGE_DIGEST is not knowable at build time and stays "unknown" unless an
      # operator sets it (the publish workflow echoes the real digest after
      # push). All three use the pass-through form (a key with no value):
      # compose resolves them from the host environment and, when unset there,
      # does not pass them at all, so the image's baked-in ENV survives.
      # Writing `VERSION: ${VERSION:-dev}` here instead would ALWAYS override
      # the baked-in value — a compose `environment:` entry beats the image ENV
      # — and re-break the footer this ticket fixes.
      VERSION:
      COMMIT_SHA:
      IMAGE_DIGEST:
      # Downloads are presigned for a browser-reachable host, not the internal
      # `minio` DNS name. Set this to the minio service's public domain.
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL}
      DEMO_TOKEN_SECRET: ${DEMO_TOKEN_SECRET:?set DEMO_TOKEN_SECRET}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    image: ghcr.io/${GHCR_OWNER}/contract-toaster-dts-frontend:latest
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ddb-data:
  minio-data:
