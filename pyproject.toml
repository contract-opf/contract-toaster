# Metadata only — this repo is not packaged or published. The single reason
# this file exists is to DECLARE the interpreter (issue #63): CI, the DTS
# container image, `.python-version` and this file must all agree on one
# Python, and tests/test_python_version_parity_63.py fails if they drift.
# Nothing here configures a build backend; do not add one without also
# teaching that test what changed.
[project]
name = "contract-toaster"
version = "0.0.0"
requires-python = ">=3.13,<3.14"

# ---------------------------------------------------------------------------
# Lint / type-check configuration (issue #65, diagnostic G4 / action B4).
#
# BASELINE-THEN-RATCHET, not a mass reformat. Every violation that existed on
# the tree when this landed is annotated in place (`# noqa: RULE` for ruff,
# a per-module `ignore_errors` override for mypy) by a mechanical pass; the
# gate then refuses NEW ones. Nothing below reformats or rewrites code, so the
# baseline commits carry no behaviour change.
#
# `ruff format --check` is deliberately NOT wired up yet: a whole-repo reformat
# collides with the in-flight #50-#59 series. Follow-up issue #90 turns it on
# once that series has landed. tests/test_lint_gates_65.py asserts it is absent
# from lint.yml and scripts/check.sh, so "not yet" cannot drift into "never
# noticed".
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "C4", "SIM", "RUF"]
ignore = ["E501"]

# RUF100 ("unused `noqa` directive") is live, and it must stay live: it is the
# half of the ratchet that makes the baseline SHRINK. Fix the code under an
# annotation and ruff tells you the annotation is now dead, so it can be
# deleted. A `# noqa` that lists RUF100 among its own codes would suppress
# exactly that report and freeze the annotation in place forever, which is why
# tests/test_lint_gates_65.py check 8 refuses to let one into the tree.
#
# `external` is the other half. These codes are real ruff rules that the
# `select` above deliberately does NOT enable, but the tree carried
# hand-written `# noqa` directives for them — with their authors' rationales —
# long before any linter ran here. Without this list RUF100 would report all
# 108 of those lines (115 code occurrences) as "non-enabled", and the only ways
# to silence it would be to delete other people's reasoning or to widen
# `select` into a second unreviewable mass annotation. Declaring them here
# keeps the comments, keeps RUF100 honest about the rules we DO enable, and
# leaves one place to edit when a family is promoted into `select`. Every entry
# is load-bearing: drop any one and `ruff check` goes red.
external = ["A002", "ANN001", "ARG001", "ARG002", "N801", "N802", "N803", "PLC0415", "SLF001"]

[tool.ruff.lint.per-file-ignores]
# The test tree is assertions, throwaway credentials and subprocess drivers by
# construction; S101/S105/S106 there are the shape of the code, not a finding.
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["backend/src", "scripts"]

# ---------------------------------------------------------------------------
# mypy baseline overrides (issue #65). One entry per module that did not
# type-check under `strict = true` when the gate landed; the same list is
# checked in as `mypy-baseline.txt`, and tests/test_lint_gates_65.py holds the
# two in lockstep and refuses to let either grow. Deleting an entry (after
# actually typing the module) is the only edit this block should ever see.
# ---------------------------------------------------------------------------

