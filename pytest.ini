# pytest configuration for contract-toaster (issue #74).
#
# THE GATE IS STILL scripts/check.sh. Every file under tests/ is a
# self-contained __main__ script run as its own process by
# scripts/collect_test_failures.sh, and that process boundary — not pytest — is
# what isolates the cross-file sys.modules pollution the suite has always had.
# Most of the tree still cannot be collected by pytest at all: many `test_*`
# functions take positional arguments that the script runner threads in, and
# pytest mis-reads those as missing fixtures.
#
# What this file is for is the convergence direction (finding G9 / action B9 in
# docs/reports/2026-09-05-stability-maintainability-qol-diagnostic.md): NEW
# tests are written pytest-style — no-argument `test_*` functions plus an
# `if __name__ == "__main__":` runner — so they pass under BOTH runners, and an
# existing test converts only when it is touched for another reason. Nothing is
# converted wholesale.
#
#   .venv/bin/python -m pytest tests/test_parallel_runner_74.py
#
# --import-mode=importlib is the load-bearing setting: it imports each TEST
# module under a name derived from its path instead of inserting the file's
# directory at the front of sys.path and registering it under its bare
# basename. That is what stops one test file from being served out of
# sys.modules to the next, which is the pollution that made a whole-tree pytest
# run unrunnable.
#
# It does NOT protect the non-test modules a test imports. Six files import a
# module called `handler` and they are six DIFFERENT files -- one per
# infra/lambda/<bundle>/ deployment bundle. Those tests must insert their own
# bundle directory unconditionally at sys.path[0], or load it by path with
# importlib; see tests/README.md -> "The `handler` collision".
#
# -p no:cacheprovider keeps pytest from writing .pytest_cache/ into the tree.
[pytest]
python_files = test_*.py
addopts = -p no:cacheprovider --import-mode=importlib
testpaths = tests
